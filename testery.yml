test_stack:
  configuration_key: node-chrome.123-java.17-nodejs.20
test_selection:
  suites:
    - default:
      rules:
        - googleRule:
          when:
            - src_changes:
                - cypress/e2e/features/google.feature
          then:
            - test_filters:
                - cypress/e2e/features/google.feature
        - googleRule2:
          when:
            - src_changes:
                - cypress/e2e/features/testery.feature
          then:
            - test_filters:
                - cypress/e2e/features/testery.feature                
